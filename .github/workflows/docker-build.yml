name: Docker Build Pipeline

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name without registry prefix (e.g. my-api)'
        required: true
        type: string
      dockerfile-path:
        description: 'Path to the Dockerfile relative to the build context'
        required: false
        default: 'Dockerfile'
        type: string
      context:
        description: 'Docker build context path'
        required: false
        default: '.'
        type: string
      working-directory:
        description: 'Working directory before running build commands'
        required: false
        default: '.'
        type: string
      push-image:
        description: 'Push the built image to the registry (requires REGISTRY_USERNAME and REGISTRY_PASSWORD secrets)'
        required: false
        default: false
        type: boolean
      registry:
        description: 'Container registry URL (e.g. ghcr.io, myacr.azurecr.io, docker.io)'
        required: false
        default: 'ghcr.io'
        type: string
      image-tag:
        description: 'Tag to apply to the image (e.g. latest, 1.0.0, a commit SHA)'
        required: false
        default: 'latest'
        type: string
      platforms:
        description: 'Target build platforms (e.g. linux/amd64, linux/amd64,linux/arm64)'
        required: false
        default: 'linux/amd64'
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry username — required when push-image is true'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password or token — required when push-image is true'
        required: false

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: inputs.push-image == true
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push-image }}
          tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
          # GitHub Actions cache is used to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image build summary
        run: |
          echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed | \`${{ inputs.push-image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ inputs.platforms }}\` |" >> $GITHUB_STEP_SUMMARY
