name: .NET QA Pipeline

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK version to use'
        required: false
        default: '8.0.x'
        type: string
      working-directory:
        description: 'Working directory containing the .NET solution or project'
        required: false
        default: '.'
        type: string
      solution-file:
        description: 'Path to a specific solution or project file (optional — auto-detected if omitted)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dotnet-qa:
    name: .NET QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ inputs.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore NuGet dependencies
        run: |
          if [ -n "${{ inputs.solution-file }}" ]; then
            dotnet restore "${{ inputs.solution-file }}"
          else
            dotnet restore
          fi

      - name: Build solution
        run: |
          if [ -n "${{ inputs.solution-file }}" ]; then
            dotnet build "${{ inputs.solution-file }}" --no-restore --configuration Release
          else
            dotnet build --no-restore --configuration Release
          fi

      - name: Run unit tests
        run: |
          if [ -n "${{ inputs.solution-file }}" ]; then
            dotnet test "${{ inputs.solution-file }}" \
              --no-build \
              --configuration Release \
              --verbosity normal \
              --logger "trx;LogFileName=test-results.trx"
          else
            dotnet test \
              --no-build \
              --configuration Release \
              --verbosity normal \
              --logger "trx;LogFileName=test-results.trx"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/*.trx'
          retention-days: 7
          if-no-files-found: ignore
